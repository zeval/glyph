name: psp-build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PSPDEV_RELEASE: v20260501

jobs:
  psp:
    name: PSP EBOOT
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            make \
            pkg-config \
            clang-format \
            curl \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-ttf-dev \
            zlib1g-dev \
            catch2

      - name: Install PSPDEV
        run: |
          curl -L \
            "https://github.com/pspdev/pspdev/releases/download/${PSPDEV_RELEASE}/pspdev-ubuntu-latest-x86_64.tar.gz" \
            -o /tmp/pspdev.tar.gz
          mkdir -p /tmp/pspdev-extract "$HOME/pspdev"
          tar -xzf /tmp/pspdev.tar.gz -C /tmp/pspdev-extract
          if [ -d /tmp/pspdev-extract/pspdev ]; then
            cp -a /tmp/pspdev-extract/pspdev/. "$HOME/pspdev/"
          else
            cp -a /tmp/pspdev-extract/. "$HOME/pspdev/"
          fi
          echo "PSPDEV=$HOME/pspdev" >> "$GITHUB_ENV"
          echo "$HOME/pspdev/bin" >> "$GITHUB_PATH"

      - name: Check dependencies
        run: make check-deps

      - name: Build PSP EBOOT
        run: make psp

      - name: Check PPSSPP harness detection
        run: make run-ppsspp

      - name: Upload EBOOT artifact
        uses: actions/upload-artifact@v4
        with:
          name: glyph-psp-eboot
          path: build/psp/EBOOT.PBP
          if-no-files-found: error
